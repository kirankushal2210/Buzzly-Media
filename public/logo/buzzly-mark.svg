<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="hexGlow" cx="70%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFF6C5" />
      <stop offset="35%" stop-color="#FFBE1A" />
      <stop offset="80%" stop-color="#F08E00" />
      <stop offset="100%" stop-color="#C86A00" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Ambient outer glow -->
  <polygon points="50,7 86,28 86,72 50,93 14,72 14,28" fill="#FFAF00" opacity="0.4" filter="url(#softGlow)" />
  <!-- Rounded Hexagon Base -->
  <path d="M 50,8
           C 53,8 83,25.5 84.5,28
           C 86,30.5 86,69.5 84.5,72
           C 83,74.5 53,92 50,92
           C 47,92 17,74.5 15.5,72
           C 14,69.5 14,30.5 15.5,28
           C 17,25.5 47,8 50,8 Z"
        fill="url(#hexGlow)" stroke="#FFE885" stroke-width="1.5" />
  <!-- Letter 'b' in dark violet -->
  <path d="M 38,24
           L 44,24
           L 44,45
           C 47,42 51,40.5 56,40.5
           C 66,40.5 72,48 72,58
           C 72,68 65,75.5 55,75.5
           C 50,75.5 46,73.5 44,70
           L 44,75
           L 38,75
           Z"
        fill="#1B0D2A" />
  <!-- Play button triangle inside 'b' bowl -->
  <polygon points="51,50 51,66 64,58" fill="url(#hexGlow)" />
</svg>